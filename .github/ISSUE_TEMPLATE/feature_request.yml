name: Feature request
description: Suggest a capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the goal, not only the API you have in mind. Knowing what you
        are actually trying to test often changes the answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The behaviour, API, or workflow you are proposing.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Workarounds you are using today, and why they fall short.
    validations:
      required: false
